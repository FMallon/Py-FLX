<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="../CSS/header.css">
    <link rel="stylesheet" href="../CSS/background.css">
    <link rel="stylesheet" href="../CSS/box.css">
</head>

<body>

    <div class="banner">
        <header>
            <h1><b>FLX</b></h1>

            <div id="search_bg">
                <svg class="search-icon"
                     width="14"
                     height="14"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="white"
                     stroke-width="1.5"
                     stroke-linecap="round">
                    <circle cx="11" cy="11" r="7"/>
                    <line x1="21" y1="21" x2="16.5" y2="16.5"/>
                </svg>

                <input
                    id="search_input"
                    type="text"
                    list="app-list"
                    autocomplete="off"
                    placeholder="Search..."
                >

                <datalist id="app-list"></datalist>

            </div>
        </header>
    </div>

    <div id="background-secondary"></div>

    <script src="../JS/gui.js"></script>

</body>
</html>
